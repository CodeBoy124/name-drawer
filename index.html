<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Name Drawer App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 100%;
        margin: 0;
        padding: 1rem;
        line-height: 1.6;
      }

      h2 {
        margin-bottom: 1rem;
        text-align: center;
      }

      .form-group {
        margin-bottom: 1rem;
      }

      label {
        display: block;
        margin-top: 0.5rem;
        font-weight: bold;
      }

      input,
      select {
        width: 100%;
        padding: 0.6rem;
        box-sizing: border-box;
        font-size: 1rem;
        text-align: left;
      }

      button {
        width: 100%;
        background: #4a90e2;
        color: white;
        padding: 0.9rem 1.2rem;
        font-size: 1rem;
        cursor: pointer;
        border: none;
        border-radius: 4px;
      }

      button:hover {
        background: #357ab8;
      }

      .result {
        margin-top: 1.2rem;
        padding: 1rem;
        background: #f9f9f9;
        border-left: 3px solid #4a90e2;
      }

      .error {
        color: #c00;
        background: #ffebee;
      }

      .info {
        color: #555;
        font-size: 0.95rem;
        padding: 0;
        position: relative;
      }

      /* Mobile improvements */
      .form-group {
        position: relative;
      }

      label {
        margin-top: 0.8rem;
      }

      /* Ensure proper spacing on small screens */
      @media (max-width: 600px) {
        .form-group {
          margin-bottom: 0.8rem;
        }

        button {
          padding: 0.9rem 1rem;
          font-size: 1.1rem;
        }

        .result,
        .error {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>

  <body>
    <h2>Name Drawer Assignment</h2>

    <div class="form-group">
      <label for="names">All Names (comma-separated)</label>
      <input
        type="text"
        id="names"
        placeholder="e.g., Alice, Bob, Charlie, Dana"
        value="Alice, Bob, Charlie, Dana"
      />
    </div>

    <div class="form-group">
      <label for="yourName">Your Name</label>
      <input type="text" id="yourName" placeholder="Your full name" value="" />
    </div>

    <div class="form-group">
      <label for="seed">Seed</label>
      <input type="number" id="seed" placeholder="Enter a seed" value="7" />
    </div>

    <div class="form-group">
      <button onclick="assign()">Get the person assigned to you</button>
    </div>

    <div id="result" class="info">(result will appear here)</div>

    <script src="main.js"></script>
  </body>
</html>
